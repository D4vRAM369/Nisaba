[package]
name = "nisaba-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nisaba"
path = "src/main.rs"

[dependencies]
nisaba-core = { path = "../nisaba-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
