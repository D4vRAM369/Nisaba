[package]
name = "nisaba-gui"
version = "0.1.0"
edition = "2021"
authors = ["D4vRAM369"]
description = "Bóveda local de tus conversaciones con IAs (Claude Code y Codex)"
license = "GPL-3.0-or-later"
repository = "https://github.com/D4vRAM369/Nisaba"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nisaba-core = { path = "../nisaba-core" }
tauri = { version = "2", features = [] }
notify = "8"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
